version: '3.8'

services:
  db:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oil_price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfiles/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  crawler_worker:
    build:
      context: .
      dockerfile: Dockerfiles/crawler.Dockerfile
    env_file: .env
    environment:
    - TZ=Asia/Ho_Chi_Minh
    - PYTHONUNBUFFERED=1
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: